server {
    listen 80;
    server_name _;

    # Allow large uploads (no limit at server level)
    client_max_body_size 0;
    # Stream request body directly to backend (no temp file buffering)
    proxy_request_buffering off;

    # Frontend static files (built by: cd frontend && npm run build)
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;   # Large file uploads
        client_max_body_size 500M; # Allow large video uploads
    }
}
