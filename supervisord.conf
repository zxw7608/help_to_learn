[supervisord]
nodaemon=true
# Write supervisord's own log to the persistent volume so crashes are traceable
logfile=/app/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=7
loglevel=info
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
# nginx access/error logs are handled by nginx itself; just capture stderr here
stdout_logfile=/app/logs/nginx.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=7
stderr_logfile=/app/logs/nginx_err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=7

[program:backend]
command=uv run uvicorn backend.main:app --host 127.0.0.1 --port 8000
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/backend.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=7
stderr_logfile=/app/logs/backend_err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=7

[program:worker]
command=uv run python backend/worker.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=7
stderr_logfile=/app/logs/worker_err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=7

# ── Cron daemon — runs the monthly log archiver ──────────────────────────────
[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
stdout_logfile=/app/logs/cron.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/logs/cron.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
