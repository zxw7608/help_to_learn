[supervisord]
nodaemon=true
# Write supervisord's own log to the persistent volume so crashes are traceable
logfile=/app/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=7
loglevel=info
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
# nginx access/error logs are handled by nginx itself; just capture stderr here
stdout_logfile=/app/logs/nginx.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=7
stderr_logfile=/app/logs/nginx_err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=7

[program:backend]
command=uv run uvicorn backend.main:app --host 127.0.0.1 --port 8000
directory=/app
autostart=true
autorestart=true
# Python logging writes app.log directly via RotatingFileHandler in main.py.
# supervisord captures uvicorn's own startup/access lines here.
stdout_logfile=/app/logs/uvicorn.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/logs/uvicorn.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
# Both stdout and stderr go to the same file (stderr_logfile used when redirect_stderr=true)
redirect_stderr=true

# ── Cron daemon — runs the monthly log archiver ──────────────────────────────
[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
stdout_logfile=/app/logs/cron.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/logs/cron.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# ── 新增：全局日志追踪进程，将文件内容输出到 Docker 终端 ────────────────────────
[program:logs-tail]
# 使用 tail -F (大写F)，能够容忍文件刚启动时不存在，并且在日志文件被 Rotate (切割) 后自动追踪新文件
command=tail -F /app/logs/supervisord.log /app/logs/nginx.log /app/logs/nginx_err.log /app/logs/cron.log /app/logs/app.log
autostart=true
autorestart=true
# 将 tail 抓取到的内容直接输出给 Docker 控制台
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0